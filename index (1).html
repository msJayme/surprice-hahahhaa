<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crawler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap">
<link rel="stylesheet" href="style.css">

</head>
<body>
<canvas id="scene" role="img" aria-label="A dark stone wall lit by a flashlight that follows your cursor, with a black widow spider stalking the light"></canvas>

<div class="dock">
  <p class="hint" id="hint">Move your light. Something is already following it.</p>
  <div class="row">
    <button type="button" id="scare" class="pill" aria-pressed="true">Jump scares on</button>
    <button type="button" id="sound" class="pill" aria-pressed="false">Sound off</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
